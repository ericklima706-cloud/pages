# Publica o site no GitHub Pages.
#
# A primeira execução falhou com "Create Pages site failed: Resource not
# accessible by integration": o GITHUB_TOKEN não pode criar o site do Pages
# enquanto Settings > Actions > General > Workflow permissions estiver em
# somente-leitura. O bloco permissions: abaixo só consegue reduzir esse teto,
# nunca aumentar.
#
# Por isso o gatilho de push está desligado — sem ele, este workflow não
# falha a cada commit. Para ligar o Pages, escolha um caminho:
#
#   A) Settings > Pages > Source: "Deploy from a branch" > main > / (root).
#      Publica direto, sem Actions. Este workflow fica sem uso.
#
#   B) Settings > Actions > General > Workflow permissions:
#      "Read and write permissions". Depois rode este workflow manualmente
#      (aba Actions > Publicar no GitHub Pages > Run workflow) e devolva o
#      gatilho de push abaixo para publicar sozinho a cada commit.
name: Publicar no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Ligar e configurar o Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Montar o site
        run: |
          mkdir -p _site
          cp *.html *.png *.webmanifest sw.js _site/
          ls -la _site

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
